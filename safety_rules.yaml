version: 1.0
updated_at: 2026-07-01

# 说明：
# - 每条 rule.response 会被代码填入"结论"段；rich 结构化模板（立即处理/禁止事项/应急升级）
#   由 web_demo/services/answer_service.py::_build_emergency_rule_answer 硬编码提供，
#   目前覆盖 R-008, R-011~R-022, R-026, R-027, R-028, R-029, R-030, R-031, R-032（应急类与重点专项）。修改 rule.response 只影响结论段。
# - enforcement: always 表示该规则命中即触发，不再要求用户输入包含意图关键词；
#   为空则退化为"关键词+意图双匹配"。对 refuse 类是"命中即拒绝"，对
#   redirect_emergency 类是"命中即按应急处置"（用于 patterns 本身即事故陈述的规则）。
#   此字段由 kb_service.match_rule 与 should_enforce_terminal_rule 共同读取。

global_policy:
  default_action: safe_answer
  low_confidence_action: ask_for_more_info
  cite_sources: true

rules:
  - id: R-028
    category: common_prohibited_behaviors
    match_type: keywords
    patterns: ["常见的禁止行为", "实验室禁止行为", "实验室里禁止"]
    action: direct_safe_answer
    severity: medium
    response: "实验室禁止行为应覆盖人员准入、个人防护、饮食卫生、无人值守、高风险操作和废弃物处置等基本红线。"

  - id: R-029
    category: daily_closing_check
    match_type: keywords
    patterns: ["每天下班前", "下班前必须检查", "离开实验室前检查", "关门前检查"]
    action: direct_safe_answer
    severity: medium
    response: "离开实验室前必须完成书面安全检查，确认人员、设备、气源、水电、通风和危化品均处于安全状态并做好记录。"

  - id: R-025
    category: incompatible_storage_pair
    match_type: keywords
    patterns: ["硝酸和乙醇", "乙醇和硝酸"]
    action: direct_safe_answer
    severity: high
    response: "不能。硝酸属于强氧化性酸，乙醇属于易燃有机溶剂，应按不相容化学品分开储存，不得放在同一柜体或同层。"

  - id: R-001
    category: dangerous_mixing
    match_type: keywords
    patterns: ["漂白水", "次氯酸钠", "盐酸", "氨水", "过氧化氢", "硝酸", "浓硫酸"]
    action: refuse
    severity: high
    response: "可能产生有毒气体或剧烈反应，禁止混合。"

  - id: R-002
    category: open_flame_flammable
    match_type: keywords
    patterns: ["酒精灯", "明火", "乙醚", "丙酮", "乙醇", "正己烷"]
    action: refuse
    severity: high
    response: "易燃溶剂禁止明火加热，请使用水浴或电热。"

  - id: R-003
    category: improper_disposal
    match_type: keywords
    patterns: ["倒入水槽", "下水道", "直接倒掉", "随意丢弃", "冲入下水道"]
    action: refuse
    severity: high
    response: "危废需按制度分类收集，禁止随意排放。"

  - id: R-004
    category: ppe_bypass
    match_type: keywords
    patterns: ["不戴手套", "不戴护目镜", "不用实验服", "省略PPE"]
    action: safe_answer
    severity: medium
    response: "必须按制度佩戴PPE，不得省略。"

  - id: R-005
    category: fume_hood_bypass
    match_type: keywords
    patterns: ["不开通风柜", "不在通风柜", "通风柜关掉", "不用通风"]
    action: refuse
    severity: high
    response: "挥发性或有毒操作必须在通风柜内进行。"

  - id: R-006
    category: self_harm_or_illegal
    match_type: keywords
    # 不使用单独的“爆炸”作为恶意意图关键词，避免把真实爆炸事故求助误判为拒答。
    patterns: ["自杀", "伤害别人", "投毒", "制造爆炸物", "爆炸装置", "炸弹", "制造武器"]
    action: refuse
    enforcement: always
    severity: critical
    response: "该问题涉及安全风险或违法行为，无法提供帮助。"

  - id: R-007
    category: prompt_injection
    match_type: keywords
    patterns: ["忽略以上", "无视规则", "系统提示", "显示提示词", "越狱"]
    action: refuse
    enforcement: always
    severity: high
    response: "无法执行该请求。"

  - id: R-008
    category: electrical_shock
    match_type: keywords
    patterns: ["触电", "高压", "裸线", "电源短路", "电起火", "电气事故", "电击伤", "触电事故", "电弧"]
    action: redirect_emergency
    severity: high
    response: "若触电/电气事故：优先断电与隔离，按应急预案处理并联系实验室管理人员。"

  - id: R-009
    category: biological_hazard
    match_type: keywords
    patterns: ["病原体", "培养细菌", "感染", "生物安全柜"]
    action: safe_answer
    severity: high
    response: "请遵循生物安全等级规定与SOP。"

  - id: R-010
    category: insufficient_info
    match_type: keywords
    # 仅匹配真正缺少主语/对象的模糊提问，不得匹配含明确场景的应急问题
    # 【重要】本规则优先级最低，仅在其他规则均未触发时使用
    # 已移除 "怎么办" 和 "怎么处理"（太宽泛，会误触发应急类问题）
    patterns: ["不知道该怎么", "这个能不能", "那个可不可以", "随便可以吗", "有什么要注意的"]
    action: ask_for_more_info
    severity: low
    response: "请补充具体的试剂/设备名称、浓度/型号和操作场景，我才能提供准确的安全建议。"

  - id: R-011
    category: chemical_splash_skin
    match_type: keywords
    patterns: ["皮肤接触", "化学灼伤", "酸碱灼伤", "化学品溅到皮肤", "皮肤被腐蚀", "皮肤被酸", "皮肤被碱", "皮肤被硝酸", "皮肤被硫酸", "皮肤被盐酸", "皮肤被氢氟酸", "溅到皮肤", "溅到手上", "浓酸溅到手上", "酸溅到手上", "酸溅到手", "碱溅到手", "手上被酸溅到", "手上被碱溅到", "手被硝酸", "手被硫酸", "手被盐酸", "手被氢氟酸", "手被酸", "手被碱", "手被化学品", "氢氟酸", "HF"]
    action: redirect_emergency
    severity: high
    response: "若化学品溅到皮肤：立即用大量清水持续冲洗，尽快脱去被污染的衣物/手套，并联系实验室管理人员或就医。"

  - id: R-012
    category: chemical_splash_eye
    match_type: keywords
    patterns: ["溅到眼睛", "眼睛溅入", "眼睛被溅入", "眼溅入", "溅入眼", "眼被溅", "眼被溅入", "眼睛被溅", "眼睛被溅到", "眼睛被酸溅到", "眼睛被碱溅到", "眼睛被酸溅入", "眼睛被碱溅入", "眼睛被酸溅", "眼睛被碱溅", "被溅到眼", "眼睛被腐蚀", "化学品进眼", "化学品入眼", "碱入眼", "酸入眼", "眼部灼伤", "洗眼器"]
    action: redirect_emergency
    severity: high
    response: "若化学品溅入眼睛：立即用洗眼器或大量清水持续冲洗，同时联系实验室管理人员并尽快就医。"

  - id: R-027
    category: reactive_metal_storage
    match_type: keywords
    patterns: ["钠金属", "金属钠", "活泼金属"]
    action: direct_safe_answer
    severity: high
    response: "金属钠、钾等活泼金属必须与水和潮气严格隔离，按SDS和本单位SOP在合适的惰性覆盖介质及密闭容器中储存，并由受训人员处置。"

  - id: R-026
    category: reactive_metal_fire
    match_type: keywords
    patterns: ["金属钠", "金属钾", "钠金属", "钾金属", "活泼金属", "金属火灾", "钠燃烧", "钾燃烧", "钠烧", "钾烧"]
    action: redirect_emergency
    severity: critical
    response: "金属钠、钾等活泼金属着火属于特殊金属火灾：立即停止操作、隔离现场，优先使用适用的D类灭火剂或干燥砂土覆盖窒息；无法控制时立即撤离并报警。"

  - id: R-013
    category: fire_smoke
    match_type: keywords
    # "炸了" 覆盖口语化的事故陈述（"反应釜炸了"），书面语"爆炸"已在列。
    patterns: ["起火", "着火", "冒烟", "火灾", "燃烧", "爆燃", "爆炸", "炸了", "火警"]
    action: redirect_emergency
    severity: critical
    response: "若发生起火/冒烟：立即停止实验、切断电源/气源；在确保安全且受过培训的前提下使用灭火器；无法控制请立刻撤离并报警。"

  - id: R-014
    category: gas_leak
    match_type: keywords
    patterns: ["气体泄漏", "闻到异味", "气瓶泄漏", "煤气味", "有毒气体"]
    action: redirect_emergency
    severity: high
    response: "若疑似气体泄漏：停止实验、关闭气源（在安全前提下），开启通风并撤离到安全区域，联系实验室管理人员处理。"

  - id: R-015
    category: chemical_spill
    match_type: keywords
    patterns: ["洒漏", "打翻", "化学品泄漏", "化学泄漏", "溶液洒在地上", "溅洒", "洒在", "洒出", "泼洒", "溢出", "洒了", "倒出", "翻倒", "泄漏", "温度计", "温度计碎", "容器碎", "碎了", "瓶碎"]
    action: redirect_emergency
    severity: high
    response: "若发生化学品泄漏：隔离现场、避免接触和吸入，在安全前提下通风并使用泄漏应急物资处理，立即报告实验室管理人员。"

  # R-030 使用 enforcement: always："昏迷"、"没有呼吸" 本身就是事故陈述，
  # 用户不写"怎么办"也是在报事故，不应因缺少意图关键词而被判成非应急输入。
  #
  # 【位置有意义】match_rule 的同分兜底是"文件里靠前者胜"。R-030 放在 R-016
  # 之前、R-013/R-026 之后，是为了让同为 critical 的规则按施救顺序排序：
  # - 火灾/金属火灾（R-026、R-013）必须压过 R-030——火场里正确的动作是撤离
  #   报警而不是冲进去做心肺复苏；
  # - 中毒/误食（R-016）必须让位于 R-030——"有人中毒晕倒"要先按失去反应处置，
  #   查明毒物是第二步。移动本块会改变这些结果。
  - id: R-030
    category: unresponsive_person
    match_type: keywords
    # 只收"人失去反应/意识"的表述：
    # - 不收单独的"倒地"——"同学触电倒地"应继续由 R-008 处置（先断电再接触），
    #   避免抢走触电专项的首要指令；
    # - 不收"心肺复苏"这类操作名——"CPR 程序应如何操作"是培训问题而非事故报告，
    #   真实事故的问句本身就含"没有呼吸/没反应"；
    # - 不收"无意识"——它在中文里也作副词用（"无意识地碰到"），改用
    #   "失去意识/意识不清/意识丧失"覆盖同一状态。
    patterns: ["昏迷", "晕倒", "昏倒", "不省人事", "失去意识", "意识不清", "意识丧失", "叫不醒", "喊不醒", "倒地不起", "倒在地上没反应", "人没反应", "没有呼吸", "呼吸停止", "心跳停止", "没有心跳", "抽搐"]
    action: redirect_emergency
    enforcement: always
    severity: critical
    response: "有人失去反应或意识属于最高优先级医疗应急：先确认现场无带电、缺氧、火源或化学品泄漏等致命危险，再呼救、拨打急救并检查反应与呼吸；无反应且无正常呼吸时由受训人员立即实施心肺复苏并使用 AED。"

  - id: R-016
    category: ingestion
    match_type: keywords
    patterns: ["误食", "误饮", "误喝", "吞咽", "吞了", "咽了", "喝到", "摄入", "中毒", "化学品进嘴", "化学品入口"]
    action: redirect_emergency
    severity: critical
    response: "若误食/误饮化学品：立即停止实验，漱口并尽快就医或联系急救，同时告知具体化学品名称与浓度。"

  - id: R-017
    category: inhalation
    match_type: keywords
    patterns: ["吸入", "吸了", "吸到气体", "刺激性气味", "咳嗽", "头晕", "呼吸困难"]
    action: redirect_emergency
    severity: high
    response: "若吸入有害气体：立即转移到新鲜空气处，必要时求助医疗或实验室管理人员。"

  - id: R-018
    category: burn
    match_type: keywords
    patterns: ["烫伤", "烧伤", "灼伤", "热烫", "烫起泡", "热起泡"]
    action: redirect_emergency
    severity: medium
    response: "若发生烫伤/灼伤：立即停止实验，用清水冷却并保护伤处，必要时就医。"

  - id: R-019
    category: cut_bleeding
    match_type: keywords
    patterns: ["割伤", "划伤", "出血", "流血", "被割到"]
    action: redirect_emergency
    severity: medium
    response: "若发生割伤/出血：立即停止实验，清洁伤口并加压止血，必要时就医。"

  - id: R-020
    category: radiation_emergency
    match_type: keywords
    patterns: ["放射源丢失", "辐射污染", "意外照射", "放射性泄漏", "核素污染"]
    action: redirect_emergency
    severity: critical
    response: "发生辐射事故：立即停止作业、疏散无关人员并隔离区域，第一时间通知本单位辐射安全负责人，按许可证、应急预案和属地监管要求上报并配合专业人员处置。"

  - id: R-021
    category: laser_injury
    match_type: keywords
    patterns: ["激光伤眼", "激光照到眼", "激光灼伤", "被激光照射"]
    action: redirect_emergency
    severity: high
    response: "疑似激光眼损伤应立即停止操作并关闭激光，保持现场原状，禁止揉眼，尽快接受眼科评估并向医生说明激光波长、功率和暴露经过。"

  - id: R-022
    category: cryogenic_injury
    match_type: keywords
    patterns: ["液氮冻伤", "低温冻伤", "被液氮烫", "液氮溅到", "冻伤", "皮肤起泡"]
    action: redirect_emergency
    severity: high
    response: "低温冻伤处置：移除未粘连的受污染衣物，用不超过 40°C 的温水缓慢复温，禁止摩擦或揉搓并尽快就医。若在密闭空间发生大量液氮泄漏，立即撤离到安全通风区域。"

  - id: R-023
    category: centrifuge_violation
    match_type: keywords
    patterns: ["离心机转着", "离心机运转时", "离心机没停", "边转边开盖", "边转边掀盖", "转的时候开盖", "转着开盖", "开盖看看", "掀盖看看", "边转边掀盖看一下"]
    action: refuse
    enforcement: always
    severity: high
    response: "绝对不能在离心机运转时开盖！必须等转子完全停止后才能打开，强行开盖有严重危险。"

  - id: R-024
    category: autoclave_violation
    match_type: keywords
    patterns: ["灭菌锅有压力", "灭菌结束立刻", "高压灭菌直接开"]
    action: refuse
    enforcement: always
    severity: high
    response: "有压力时严禁强制开门！灭菌结束后须慢速放汽，等压力归零、温度降至安全值后，人站在两侧才能缓慢开盖。"

  # R-031/R-032 使用 enforcement: always。它们的 patterns 本身就是事故陈述
  # （"液氮罐压力异常"、"有人受伤"），用户不写"怎么办"也是在报事故，不应因
  # 缺少意图关键词而被判成非应急输入。R-030 同理，见其所在位置的注释。
  - id: R-031
    category: cryogenic_overpressure
    match_type: keywords
    # 限定在低温容器上，不使用泛化的"压力异常"——灭菌锅、微波消解等压力
    # 场景各有专项规则和处置方式。
    patterns: ["液氮罐压力", "液氮压力", "液氮超压", "液氮罐超压", "杜瓦瓶压力", "杜瓦瓶超压", "杜瓦瓶安全阀", "液氮罐安全阀", "低温储罐压力", "液氮罐泄压", "液氮罐鼓包", "液氮罐变形", "液氮罐冒白雾", "安全阀起跳", "安全阀持续排放"]
    action: redirect_emergency
    enforcement: always
    severity: high
    response: "低温容器压力异常升高或安全阀持续起跳，说明内压正在失控：立即停止取用和转注、人员撤离到远离罐体和泄放方向的位置，通知设备管理人员与EHS，由受训人员按厂家程序处置；同时按低温液体大量汽化的缺氧风险开门通风撤离。"

  # R-032 是人员伤害的兜底规则，severity 取 low：任何更具体的规则（触电
  # R-008、灼伤 R-018、割伤 R-019、失去反应 R-030 …）只要意图对齐就会压过
  # 它；只有在没有专项规则、或专项规则与意图不匹配（如"浓硫酸溅到手臂上了"
  # 曾落到 R-001"禁止混合"）时才由它接住。它保证一个已经发生的人身伤害绝不
  # 会掉进"这个问题不在服务范围内"。
  # patterns 必须与 web_demo/repositories.py::CASUALTY_INTENT_MARKERS 逐字
  # 一致，由 tests/test_emergency_rules.py 断言。
  - id: R-032
    category: casualty_report_fallback
    match_type: keywords
    patterns: ["昏迷", "晕倒", "昏倒", "不省人事", "失去意识", "意识不清", "意识丧失", "叫不醒", "喊不醒", "没回应", "没有回应", "没反应", "没有反应", "无反应", "瘫倒", "倒地不起", "没有呼吸", "呼吸停止", "心跳停", "抽搐", "口吐白沫", "脸色发紫", "喘不上气", "眼前发黑", "休克", "出血", "流血", "止不住血", "割到", "划破", "划开", "扎到", "扎进", "扎了", "刺伤", "咬伤", "拔不出来", "断指", "被切断", "摔下来", "摔下去", "摔倒", "跌倒", "砸到", "被砸", "撞到头", "夹伤", "夹住", "卷进", "卷入", "卷住", "压伤", "挤伤", "被打到", "电到", "烫到", "粘住", "溅到脸", "溅到手", "溅到眼", "溅到皮肤", "溅到身上", "送医", "救护车", "有人受伤", "人受伤"]
    action: redirect_emergency
    enforcement: always
    severity: low
    response: "已经有人受伤时，先保证施救者自身安全，再呼救、拨打急救并按伤情类型处置：确认现场没有带电、缺氧、火源或化学品泄漏后再靠近，不要独自处理，同时通知实验室负责人。"

