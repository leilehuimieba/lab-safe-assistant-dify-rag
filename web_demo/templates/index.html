<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基于 Dify 的实验室安全小助手</title>
  <style>
    :root { color-scheme: light; --bg:#f6f8fb; --card:#fff; --text:#182033; --muted:#667085; --brand:#2563eb; --ok:#15803d; --warn:#b45309; --border:#d9e2ef; }
    body { margin:0; font-family:"Microsoft YaHei", system-ui, sans-serif; background:linear-gradient(135deg,#eef5ff,#f8fafc); color:var(--text); }
    main { max-width:1080px; margin:0 auto; padding:32px 20px 48px; }
    .hero { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; align-items:stretch; }
    .card { background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:0 14px 30px rgba(15,23,42,.08); }
    h1 { margin:0 0 10px; font-size:30px; }
    h2 { margin:0 0 14px; font-size:20px; }
    p { line-height:1.75; }
    .muted { color:var(--muted); }
    .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .badge { padding:6px 10px; background:#eaf2ff; color:#1d4ed8; border-radius:999px; font-size:13px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    textarea, input { width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:12px; padding:12px; font:inherit; background:#fff; }
    textarea { min-height:118px; resize:vertical; }
    button { border:0; background:var(--brand); color:white; padding:11px 16px; border-radius:12px; font-weight:700; cursor:pointer; }
    button.secondary { background:#334155; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    pre { white-space:pre-wrap; word-break:break-word; background:#0f172a; color:#e5e7eb; border-radius:14px; padding:16px; min-height:120px; }
    .status div { display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px dashed var(--border); }
    .status span:last-child { font-weight:700; text-align:right; }
    .citations { display:grid; gap:10px; }
    .citation { border:1px solid var(--border); border-radius:12px; padding:12px; background:#fbfdff; }
    .citation b { color:#1d4ed8; }
    @media (max-width: 820px) { .hero,.grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="card">
      <h1>基于 Dify 的实验室安全小助手</h1>
      <p class="muted">这是从当前大创闭环项目中抽离出的第一个项目：聚焦 Dify + RAG + 实验室安全知识库问答，不包含风险评估、培训考核、管理看板和事故复盘等扩展模块。</p>
      <div class="badges">
        <span class="badge">Dify 工作流</span><span class="badge">RAG 知识库</span><span class="badge">安全规则约束</span><span class="badge">引用追溯</span><span class="badge">低置信补强队列</span>
      </div>
    </div>
    <div class="card status" id="meta"><h2>运行状态</h2><p class="muted">正在读取...</p></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>实验室安全问答</h2>
      <label for="question">问题</label>
      <textarea id="question">实验室发生化学品泄漏时，第一步应该怎么做？</textarea>
      <div class="row">
        <button id="askBtn">发送到 Dify/RAG 链路</button>
        <button class="secondary" id="searchBtn">只检索本地知识库</button>
        <button class="secondary" id="newSessionBtn" style="background:#475569;">新建会话</button>
      </div>
      <p class="muted">未配置 DIFY_APP_API_KEY 时，接口会使用结构化兜底回答，便于本地演示。</p>
    </div>
    <div class="card">
      <h2>回答 <span id="elapsed" style="font-size:14px;color:var(--muted);"></span></h2>
      <pre id="answer">等待提问...</pre>
      <div class="row" id="feedbackRow" style="display:none;">
        <button id="usefulBtn" style="background:#15803d;">有用</button>
        <button id="notUsefulBtn" style="background:#b45309;">无用</button>
        <span id="feedbackMsg" class="muted" style="margin-left:8px;"></span>
      </div>
    </div>
  </section>

  <section class="card" style="margin-top:18px;">
    <h2>引用 / 检索结果</h2>
    <div class="citations" id="citations"><p class="muted">暂无引用。</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let _lastAnswer = '', _lastQuestion = '';
function getSessionId(){
  let sid = localStorage.getItem('lab_session_id') || '';
  if(!sid){ sid = 'sess_'+Math.random().toString(36).slice(2,14); localStorage.setItem('lab_session_id', sid); }
  return sid;
}
function newSession(){
  localStorage.removeItem('lab_session_id');
  $('feedbackRow').style.display='none';
  $('elapsed').textContent='';
  $('answer').textContent='等待提问...';
  renderCitations([]);
}
function renderCitations(items){
  if(!items || !items.length){ $('citations').innerHTML='<p class="muted">暂无引用。</p>'; return; }
  $('citations').innerHTML = items.map(it => `<div class="citation"><b>${esc(it.kb_id || '-')}</b> ${esc(it.title || '')}<br><span class="muted">score=${esc(it.score)} | risk=${esc(it.risk_level || '-')} | source=${esc(it.source_title || '-')}</span><p>${esc(it.snippet || '')}</p></div>`).join('');
}
async function loadMeta(){
  const data = await fetch('/api/meta').then(r=>r.json());
  const times = await fetch('/api/stats').then(r=>r.json()).catch(()=>({}));
  const statsTxt = times.recent_count ? ` | 最近${times.recent_count}次响应: 平均${times.recent_avg_ms}ms P50=${times.recent_p50_ms}ms` : '';
  $('meta').innerHTML = `<h2>运行状态</h2>
    <div><span>应用版本</span><span>${esc(data.app_version)}</span></div>
    <div><span>问答链路</span><span>${esc(data.chat_lane_lab)}</span></div>
    <div><span>Dify API</span><span>${esc(data.dify_base_url)}</span></div>
    <div><span>Dify Key</span><span>${data.dify_app_key_configured ? '已配置' : '未配置'}</span></div>
    <div><span>知识库</span><span>${esc(data.knowledge_base_imported)} 正式导入 / ${esc(data.knowledge_base_rows)} 本地</span></div>
    <div><span>扩展数据</span><span>${esc(data.knowledge_base_external || 0)} 外部权威来源；${esc(data.knowledge_base_chunked || 0)} 切分片段仅作检索粒度优化</span></div>
    <div><span>评测口径</span><span>${esc(data.formal_eval_score)}；${esc(data.stability_status)}</span></div>
    <div><span>性能</span><span>${esc(statsTxt || '暂无数据')}</span></div>`;
}
async function ask(){
  $('askBtn').disabled=true; $('answer').textContent='请求中...'; $('feedbackRow').style.display='none'; $('elapsed').textContent=''; renderCitations([]);
  const q = $('question').value;
  try{
    const data = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'lab',question:q,session_id:getSessionId()})}).then(async r=>{if(!r.ok) throw new Error(await r.text()); return r.json();});
    $('answer').textContent = `[${data.decision} | ${data.model}]\n\n${data.answer}`;
    $('elapsed').textContent = `(${data.elapsed_ms||0}ms)`;
    _lastAnswer = data.answer; _lastQuestion = q;
    $('feedbackRow').style.display='flex';
    $('feedbackMsg').textContent='';
    renderCitations(data.citations);
  }catch(e){ $('answer').textContent='请求失败：'+e.message; }
  finally{ $('askBtn').disabled=false; }
}
async function sendFeedback(rating){
  $('usefulBtn').disabled=true; $('notUsefulBtn').disabled=true;
  try{
    await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:getSessionId(),question:_lastQuestion,answer:_lastAnswer,rating:rating})});
    $('feedbackMsg').textContent='感谢反馈！';
  }catch(e){ $('feedbackMsg').textContent='反馈提交失败'; }
  finally{ $('usefulBtn').disabled=false; $('notUsefulBtn').disabled=false; }
}
async function searchOnly(){
  $('searchBtn').disabled=true; $('answer').textContent='检索中...';
  try{
    const data = await fetch('/api/search?q='+encodeURIComponent($('question').value)+'&top_k=5').then(r=>r.json());
    $('answer').textContent = `本地知识库命中 ${data.count} 条。`;
    renderCitations(data.citations);
  }catch(e){ $('answer').textContent='检索失败：'+e.message; }
  finally{ $('searchBtn').disabled=false; }
}
$('askBtn').addEventListener('click', ask);
$('searchBtn').addEventListener('click', searchOnly);
$('newSessionBtn').addEventListener('click', newSession);
$('usefulBtn').addEventListener('click', ()=>sendFeedback('useful'));
$('notUsefulBtn').addEventListener('click', ()=>sendFeedback('not_useful'));
loadMeta().catch(e => $('meta').innerHTML='<h2>运行状态</h2><p class="muted">读取失败：'+esc(e.message)+'</p>');
</script>
</body>
</html>
